<body>
      <audio id="audio-fundo" src="./mixkit-game-show-fun-suspense-942.wav" loop></audio>

<audio id="audio-vitoria" src="./mixkit-completion-of-a-level-2063.wav"></audio>

<div id="tela-inicio" class="tela-cheia">
    <h1 class="titulo-jogo">JOGO DO ALFABETO</h1>
    <button id="btn-comecar" class="btn btn-success btn-lg pulsante">COMEÇAR</button>
</div>

            <div id="letra-alvo" class="letra-destaque">?</div>
        </div>

            <p class="lead">Você completou o alfabeto!</p>
            <button id="btn-reiniciar" class="btn btn-primary btn-lg mt-3">Jogar Novamente</button>
        </div>

  
<div class="container text-center mt-3 d-none" id="conteudo-jogo">
   </div>

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')

      }
